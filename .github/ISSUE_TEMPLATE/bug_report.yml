name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please do not paste API keys, and do not report security problems here (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The title and options you used, the step that failed (see "How this was made"), the commands you ran.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options: [fake, openai, gemini, other OpenAI-compatible]
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
